name: Update Chinese calendar
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python generate.py
      - name: Commit changed calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hungary-holidays-zh.ics
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Chinese holiday calendar'
            git push
          fi
